<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Notas"><meta name="theme-color" content="#f0efe2"><title>Notas</title></head><body>
<title>Notas</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fdfcf7; --card: #ffffff; --ink: #23261b; --body: #454a39; --mute: #696d5a; --line: #e2e0d0; --border: rgba(35,38,27,.14);
    --accent: #5d6a2b; --accent-rgb: 93,106,43; --on-accent: #ffffff; --amber: #b98a1f; --glow: #5d6a2b;
    --side: #f0efe2; --side2: #fffffb; --side-ink: #23261b; --side-mute: #696d5a; --side-line: rgba(35,38,27,.11); --side-hover: rgba(70,78,30,.09);
    --good: #3f6b1f; --bad: #a3331f; --bad-bg: #f4d6cc; --warn: #7d5a00; --warn-bg: #f3e6bd; --mark: #ece4a4; --mark-ink: #23261b;
    --shadow: 0 18px 44px rgba(45,50,25,.18); --hero: #e8e7d3; --toast: #23261b; --toast-ink: #ffffff;
    --o1: #5d6a2b; --o2: #a3ad62; --o3: #d9c77a; --o4: #7d8a4a; --o5: #37441f;
    --ease: cubic-bezier(.2,.8,.2,1);
    --serif: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Helvetica, system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark;
      --bg: #1b1d16; --card: #262a1f; --ink: #f5f4ea; --body: #d9d9c9; --mute: #abad99; --line: #3b3f30; --border: rgba(245,244,234,.14);
      --accent: #b9c76e; --accent-rgb: 185,199,110; --on-accent: #1b1d16; --glow: #b9c76e;
      --side: #22251b; --side2: #33372a; --side-ink: #f5f4ea; --side-mute: #b3b5a2; --side-line: rgba(245,244,234,.10); --side-hover: rgba(245,244,234,.07);
      --good: #a9d08a; --bad: #ff9a8a; --bad-bg: rgba(248,113,113,.18); --warn: #e9c46a; --warn-bg: rgba(233,196,106,.18); --mark: #d9c77a; --mark-ink: #1b1d16;
      --shadow: 0 18px 44px rgba(0,0,0,.55); --hero: #22251b; --toast: #f5f4ea; --toast-ink: #1b1d16;
      --o1: #7d8a3e; --o2: #a3ad62; --o3: #d9c77a; --o4: #8f9a55; --o5: #4c5a2c; } }
  :root[data-theme="dark"] { color-scheme: dark;
      --bg: #1b1d16; --card: #262a1f; --ink: #f5f4ea; --body: #d9d9c9; --mute: #abad99; --line: #3b3f30; --border: rgba(245,244,234,.14);
      --accent: #b9c76e; --accent-rgb: 185,199,110; --on-accent: #1b1d16; --glow: #b9c76e;
      --side: #22251b; --side2: #33372a; --side-ink: #f5f4ea; --side-mute: #b3b5a2; --side-line: rgba(245,244,234,.10); --side-hover: rgba(245,244,234,.07);
      --good: #a9d08a; --bad: #ff9a8a; --bad-bg: rgba(248,113,113,.18); --warn: #e9c46a; --warn-bg: rgba(233,196,106,.18); --mark: #d9c77a; --mark-ink: #1b1d16;
      --shadow: 0 18px 44px rgba(0,0,0,.55); --hero: #22251b; --toast: #f5f4ea; --toast-ink: #1b1d16;
      --o1: #7d8a3e; --o2: #a3ad62; --o3: #d9c77a; --o4: #8f9a55; --o5: #4c5a2c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Avenir Next", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Helvetica, system-ui, -apple-system, Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { display: grid; grid-template-columns: 264px 340px minmax(0, 1fr); height: 100vh; height: 100dvh; }

  /* ---------- barra lateral ---------- */
  .side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 16px 16px 10px; }
  .kicker { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--glow); }
  .kicker::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .brand h1 { margin: 4px 0 0; font-size: 18px; }
  .search { margin: 6px 12px 10px; position: relative; }
  .search input { width: 100%; padding: 9px 10px 9px 32px; border-radius: 9px; border: 1px solid var(--side-line); background: var(--side2); color: #fff; outline: none; }
  .search input::placeholder { color: var(--side-mute); opacity: 1; }
  .search input:focus { border-color: var(--glow); }
  .search svg { position: absolute; left: 10px; top: 10px; opacity: .8; }
  .new { margin: 0 12px 10px; display: flex; gap: 8px; }
  .new button { flex: 1; border: none; border-radius: 9px; padding: 9px 10px; font-weight: 700; background: var(--glow); color: #0b130e; }
  .new button.t { flex: none; background: var(--side2); color: #fff; border: 1px solid var(--side-line); }
  .nav { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
  .nav h3 { display: flex; align-items: center; justify-content: space-between; margin: 14px 8px 4px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--side-mute); }
  .nav h3 button { border: none; background: none; color: var(--side-mute); font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .nav h3 button:hover { background: var(--side2); color: #fff; }
  .ni { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: none; background: none; color: var(--side-ink); border-radius: 8px; text-align: left; }
  .ni:hover { background: rgba(255,255,255,.07); }
  .ni.on { background: var(--side2); box-shadow: inset 3px 0 0 var(--glow); }
  .ni .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ni .ct { font-size: 11.5px; color: var(--side-mute); }
  .ni .ct.hot { background: var(--amber); color: #0b130e; border-radius: 999px; padding: 0 7px; font-weight: 700; }
  .ni .mo { visibility: hidden; border: none; background: none; color: var(--side-mute); padding: 0 4px; border-radius: 5px; font-size: 15px; }
  .ni:hover .mo, .ni .mo:focus { visibility: visible; }
  .ni.sub { padding-left: 28px; }
  .ni .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .ni .caret { width: 12px; text-align: center; color: var(--side-mute); font-size: 10px; }
  .foot { border-top: 1px solid var(--side-line); padding: 8px; }
  .foot button { width: 100%; text-align: left; border: none; background: none; color: var(--side-mute); padding: 7px 8px; border-radius: 8px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
  .foot button:hover { background: rgba(255,255,255,.07); color: #fff; }
  .foot .st { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
  .foot .st.ok { background: #4ade80; } .foot .st.err { background: #f87171; }

  /* ---------- lista ---------- */
  .list { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .lhead { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .lhead .row { display: flex; align-items: center; gap: 8px; }
  .lhead h2 { margin: 0; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lhead .sub { font-size: 12px; color: var(--mute); margin-top: 2px; }
  .lhead select { border: 1px solid var(--border); background: var(--card); border-radius: 7px; padding: 4px 6px; font-size: 12px; }
  .items { flex: 1; overflow-y: auto; padding: 10px; }
  .nc { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 11px 12px; margin-bottom: 8px; }
  .nc:hover { border-color: rgba(var(--accent-rgb), .5); }
  .nc.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .22); }
  .nc .tt { font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
  .nc .tt span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nc .sn { color: var(--body); font-size: 12.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nc .mt { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 7px; font-size: 11.5px; color: var(--mute); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: rgba(var(--accent-rgb), .12); color: var(--accent); font-size: 11.5px; font-weight: 700; }
  .chip.cat { background: transparent; border: 1px solid var(--border); color: var(--body); }
  .chip.cat i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .chip button { border: none; background: none; padding: 0 0 0 2px; color: inherit; font-size: 13px; line-height: 1; }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 2px; }
  .empty { text-align: center; color: var(--mute); padding: 40px 20px; }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  /* ---------- tarefas ---------- */
  .tk { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px; background: var(--card); border: 1px solid var(--border); margin-bottom: 6px; }
  .tk input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
  .tk .ti { flex: 1; min-width: 0; border: none; background: none; outline: none; padding: 2px 0; }
  .tk.done .ti { text-decoration: line-through; color: var(--mute); }
  .tk input[type=date] { border: 1px solid var(--border); background: transparent; border-radius: 6px; padding: 2px 4px; font-size: 12px; width: 126px; }
  .tk .late { color: var(--bad); font-weight: 700; }
  .tk button { border: none; background: none; color: var(--mute); padding: 2px 6px; border-radius: 6px; }
  .tk button:hover { background: rgba(var(--accent-rgb), .12); color: var(--accent); }
  .tgrp { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 12px 4px 6px; }
  .tgrp.bad { color: var(--bad); }
  .tadd { display: flex; gap: 6px; margin-bottom: 8px; }
  .tadd input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 7px 9px; }
  .tadd input[type=date] { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 6px; width: 132px; }

  /* ---------- editor ---------- */
  .edit { background: var(--card); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .ehead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .ehead select, .ehead .tagin { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; max-width: 190px; }
  .ehead .tagin { width: 120px; }
  .ehead .sp { flex: 1; }
  .ib { border: 1px solid transparent; background: none; border-radius: 7px; padding: 5px 8px; color: var(--body); font-weight: 700; min-width: 32px; }
  .ib:hover { background: rgba(var(--accent-rgb), .10); color: var(--accent); }
  .ib.on { color: var(--amber); }
  .back { display: none; }
  .tb { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 2; }
  .tb .sep { width: 1px; background: var(--line); margin: 4px 6px; }
  .tb .ib.ins { color: var(--accent); }
  .escroll { flex: 1; overflow-y: auto; }
  .doc { max-width: 860px; margin: 0 auto; padding: 18px 26px 60px; }
  .title { width: 100%; border: none; outline: none; background: none; font-size: 26px; font-weight: 700; padding: 4px 0 8px; }
  .title::placeholder { color: var(--mute); opacity: 1; }
  .meta { font-size: 12px; color: var(--mute); margin-bottom: 12px; }
  .content { min-height: 240px; outline: none; font-size: 15px; line-height: 1.6; color: var(--ink); overflow-wrap: anywhere; }
  .content:empty::before { content: "Escreve aqui. Arrasta ou cola imagens e ficheiros; usa a barra para embutir uma página web."; color: var(--mute); }
  .content h1 { font-size: 22px; margin: 18px 0 6px; } .content h2 { font-size: 18px; margin: 16px 0 6px; }
  .content p { margin: 0 0 10px; }
  .content a { color: var(--accent); }
  .content blockquote { margin: 10px 0; padding: 6px 14px; border-left: 4px solid var(--amber); background: rgba(var(--accent-rgb), .06); border-radius: 0 8px 8px 0; color: var(--body); }
  .content pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  .content img { max-width: 100%; border-radius: 8px; display: block; margin: 8px 0; }
  .content table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  .content td, .content th { border: 1px solid var(--line); padding: 6px 8px; min-width: 60px; vertical-align: top; }
  .content hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  .content ul.chk { list-style: none; padding-left: 4px; }
  .content ul.chk li { position: relative; padding-left: 28px; margin: 3px 0; }
  .content ul.chk li::before { content: ""; position: absolute; left: 0; top: 3px; width: 17px; height: 17px; border: 2px solid var(--accent); border-radius: 5px; cursor: pointer; }
  .content ul.chk li[data-c="1"] { color: var(--mute); text-decoration: line-through; }
  .content ul.chk li[data-c="1"]::before { background: var(--accent); box-shadow: inset 0 0 0 3px var(--card); }
  .att { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 9px 12px; margin: 8px 0; user-select: none; }
  .att .ic { width: 34px; height: 34px; border-radius: 8px; background: rgba(var(--accent-rgb), .14); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10.5px; flex: none; }
  .att .nm { flex: 1; min-width: 0; } .att .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .att .nm span { font-size: 12px; color: var(--mute); }
  .emb { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin: 10px 0; background: var(--bg); user-select: none; }
  .emb .bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; color: var(--body); border-bottom: 1px solid var(--border); }
  .emb .bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emb .bar a, .emb .bar button, .att a, .att button { border: 1px solid var(--border); background: var(--card); border-radius: 7px; padding: 3px 9px; font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; }
  .emb iframe, .emb video { display: block; width: 100%; height: 460px; border: 0; background: #fff; }
  .emb audio { display: block; width: 100%; }
  .emb .hint { padding: 6px 10px; font-size: 11.5px; color: var(--mute); }
  .sec { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
  .sec h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .drop { outline: 3px dashed var(--accent); outline-offset: -8px; }

  /* ---------- modal / menu / toast ---------- */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .md { background: var(--card); color: var(--ink); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 18px; }
  .md h3 { margin: 0 0 10px; font-size: 16px; }
  .md p { color: var(--body); margin: 0 0 10px; }
  .md label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 10px 0 4px; }
  .md input[type=text], .md input[type=url], .md select { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .md .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--border); background: var(--card); border-radius: 9px; padding: 8px 14px; font-weight: 700; color: var(--ink); }
  .btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.d { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .opt { border: 1px solid var(--border); border-radius: 11px; padding: 12px; margin-top: 10px; }
  .opt h5 { margin: 0 0 4px; font-size: 14px; } .opt p { font-size: 12.5px; margin: 0 0 8px; }
  .opt .on { color: var(--good); font-weight: 700; font-size: 12.5px; }
  .menu { position: fixed; z-index: 60; background: var(--card); color: var(--ink); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; min-width: 190px; }
  .menu button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 7px 10px; border-radius: 7px; }
  .menu button:hover { background: rgba(var(--accent-rgb), .12); }
  .menu button.d { color: var(--bad); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--side); color: #fff; border: 1px solid var(--side-line); padding: 9px 16px; border-radius: 999px; z-index: 70; box-shadow: var(--shadow); max-width: 92vw; }
  .warn { background: var(--warn-bg); color: var(--warn); padding: 8px 14px; font-size: 12.5px; font-weight: 700; }

  /* ---------- marca, movimento e Início ---------- */
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--glow), #0b7a34); box-shadow: 0 4px 14px rgba(61,220,132,.35); position: relative; }
  .logo::after { content: ""; position: absolute; inset: 7px 8px; border-radius: 2px; background: rgba(255,255,255,.9); clip-path: polygon(0 0, 65% 0, 100% 30%, 100% 100%, 0 100%); }
  .ni, .nc, .btn, .ib, .new button, .tk, .hcard, .hnb { transition: transform .18s var(--ease), box-shadow .18s var(--ease), background-color .15s, border-color .15s, color .15s; }
  .nc:hover, .hcard:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(20,24,22,.12); }
  .btn:active, .new button:active, .ib:active { transform: scale(.96); }
  .new button:hover { box-shadow: 0 6px 18px rgba(61,220,132,.35); }
  .items > *, .hsec { animation: rise .32s var(--ease) both; }
  .items > *:nth-child(2) { animation-delay: .03s; } .items > *:nth-child(3) { animation-delay: .06s; } .items > *:nth-child(4) { animation-delay: .09s; } .items > *:nth-child(5) { animation-delay: .12s; } .items > *:nth-child(n+6) { animation-delay: .15s; }
  .doc { animation: fade .25s ease both; }
  .md { animation: pop .22s var(--ease) both; } .ov { animation: fade .15s ease both; } .menu { animation: pop .14s var(--ease) both; transform-origin: top left; }
  .toast { animation: toastIn .28s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px); } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } }
  body[data-home] .list { grid-column: 2 / 4; border-right: none; }
  body[data-home] .edit { display: none; }
  .list, .side, .edit { min-width: 0; }
  .home { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; min-width: 0; width: 100%; }
  .hsec, .hgrid > div { min-width: 0; }
  .hero { position: sticky; top: 0; height: 250px; overflow: hidden; background: linear-gradient(120deg, var(--hero1), var(--hero2)); color: #fff; z-index: 0; }
  .hero .ly { position: absolute; border-radius: 50%; filter: blur(2px); will-change: transform; }
  .hero .l1 { width: 420px; height: 420px; right: -90px; top: -160px; background: radial-gradient(circle at 30% 30%, rgba(61,220,132,.55), rgba(61,220,132,0) 70%); }
  .hero .l2 { width: 300px; height: 300px; left: 34%; top: 60px; background: radial-gradient(circle at 50% 50%, rgba(232,163,61,.35), rgba(232,163,61,0) 70%); }

        canDbx ? '<p>Sincroniza com uma pasta privada da tua Dropbox. Precisas de criar uma «app» tua em dropbox.com/developers (acesso «App folder», permissões files.content.read e files.content.write) e de lhe juntar este endereço de redireccionamento: <b>' + esc(REDIR) + '</b></p><label>App key</label><input type="text" name="key" placeholder="ex.: a1b2c3d4e5f6g7h"><div style="margin-top:8px"><button class="btn p" data-r="dbx">Ligar à Dropbox</button></div>' :
        '<p>Disponível quando as Notas estão alojadas num endereço https próprio' + (IN_FRAME ? ' (dentro do Claude não é possível)' : '') + '.</p>') + '</div>' +
      '<div class="acts"><button class="btn" data-r="no">Fechar</button></div>', function (ov, done) {
        ov.addEventListener("click", function (e) { var b = e.target.closest('[data-r="dbx"]'); if (b) { e.stopPropagation(); var k = $('[name="key"]', ov).value.trim(); if (!k) { toast("Indica a App key."); return; } dbxStart(k); } }, true);
      }).then(function (r) {
        if (r === "exp") exportAll(); else if (r === "imp") $("#bakPick").click();
        else if (r === "folder") window.showDirectoryPicker({ mode: "readwrite", id: "notas" }).then(function (dir) { sync.kind = "folder"; sync.dir = dir; sync.needPerm = false; kvSet("sync", { kind: "folder", dir: dir }); doSync(true); }, function () {});
        else if (r === "off") { sync.kind = null; sync.dir = null; sync.dbx = null; kvSet("sync", null); paintSync(); toast("Sincronização desligada. As notas continuam neste dispositivo."); }
      });
  }
  // Dropbox: OAuth 2 com PKCE (sem segredo; o código corre só no browser)
  function dbxStart(key) {
    var v = Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(48)), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)).then(function (h) {
      var ch = btoa(String.fromCharCode.apply(null, new Uint8Array(h))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      sessionStorage.setItem("dbx_pkce", JSON.stringify({ v: v, key: key }));
      location.href = "https://www.dropbox.com/oauth2/authorize?" + new URLSearchParams({ client_id: key, response_type: "code", code_challenge: ch, code_challenge_method: "S256", token_access_type: "offline", redirect_uri: REDIR });
    });
  }
  function dbxFinish() {
    var code = new URLSearchParams(location.search).get("code"), st = null; try { st = JSON.parse(sessionStorage.getItem("dbx_pkce") || "null"); } catch (e) {}
    if (!code || !st) return Promise.resolve();
    history.replaceState(null, "", REDIR); sessionStorage.removeItem("dbx_pkce");
    return fetch("https://api.dropboxapi.com/oauth2/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ code: code, grant_type: "authorization_code", code_verifier: st.v, client_id: st.key, redirect_uri: REDIR }) })
      .then(function (r) { return r.json(); }).then(function (j) {
        if (!j.refresh_token) { toast("A Dropbox não autorizou a ligação."); return; }
        sync.kind = "dropbox"; sync.dbx = { key: st.key, refresh: j.refresh_token, access: j.access_token, exp: Date.now() + (j.expires_in || 0) * 1000 };
        return kvSet("sync", { kind: "dropbox", dbx: { key: st.key, refresh: j.refresh_token } }).then(function () { toast("Dropbox ligada."); });
      }, function () { toast("Não foi possível ligar à Dropbox."); });
  }

  // ============================================================ arranque
  function renderAll() { renderNav(); renderList(); renderEditor(); paintSync(); }
  idbOpen().then(function () { return Promise.all([kvGet("state"), kvGet("sel"), kvGet("sync"), kvGet("syncLast"), kvGet("scratch")]); }).then(function (r) {
    scratch = r[4] || "";
    if (r[0]) COLS.concat(["deleted"]).forEach(function (c) { S[c] = r[0][c] || {}; });
    seed(); sel = r[1] && S.notes[r[1]] && !S.notes[r[1]].trashed ? r[1] : null; sync.last = r[3] || null;
    var sc = r[2];
    if (sc && sc.kind === "folder" && sc.dir && canFolder) { sync.kind = "folder"; sync.dir = sc.dir; return sc.dir.queryPermission({ mode: "readwrite" }).then(function (p) { sync.needPerm = p !== "granted"; }, function () { sync.needPerm = true; }); }
    if (sc && sc.kind === "dropbox" && sc.dbx) { sync.kind = "dropbox"; sync.dbx = sc.dbx; }
  }).then(dbxFinish).then(function () {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    pane("list"); renderAll(); if (remote()) doSync(false);
  });
  addEventListener("beforeunload", function () { saveNote(); kvSet("state", S); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) { saveNote(); kvSet("state", S); } else if (remote()) doSync(false); });
  setInterval(function () { if (remote() && !document.hidden) doSync(false); }, 120000);
  window.__notas = { S: function () { return S; }, merge: merge };
})();
